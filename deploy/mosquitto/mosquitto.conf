# Lookout broker. Device and server clients on 1883; WebSockets on 9001 for browser clients.
persistence false
log_dest stdout
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Lookout's own messages are at most 340 bytes up and 270 down; drone fronts are larger JSON.
# This broker-side cap backs up the application governor.
max_packet_size 262144

listener 1883

listener 9001
protocol websockets
