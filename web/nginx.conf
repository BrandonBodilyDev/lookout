server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Only this site, the two keyless tile hosts, and the live WebSocket. Inline styles are allowed
  # because React style attributes and MapLibre's controls use them; inline scripts are not.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: https://tiles.openfreemap.org https://tiles.mapterhorn.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # SignalR: WebSocket upgrade for live incident updates.
  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
