name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test
      - name: Demo scenario alert log
        run: dotnet run --project src/Lookout.Sim -- scenarios/pine-valley-wind-shift.yaml

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
