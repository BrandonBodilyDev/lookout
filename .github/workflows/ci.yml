name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (.NET 10, TimescaleDB via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Engine, link and API tests
        run: dotnet test
      - name: Demo scenario alert log
        run: dotnet run --project src/Lookout.Sim -- scenarios/pine-valley-wind-shift.yaml

  migrations:
    name: Release migration script (idempotent, applied twice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore src/Lookout.Api
      - name: Generate the reviewed release script
        run: dotnet ef migrations script --idempotent --project src/Lookout.Api -o release.sql
      - name: Start a fresh TimescaleDB with the runtime role
        run: |
          docker run -d --name db -e POSTGRES_USER=lookout -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=lookout \
            -v "$PWD/deploy/postgres/020_lookout_runtime.sql":/docker-entrypoint-initdb.d/020_lookout_runtime.sql:ro \
            timescale/timescaledb-ha:pg17.11-ts2.31.0
          for i in $(seq 1 60); do docker exec db pg_isready -U lookout -d lookout && break; sleep 2; done
          sleep 5
      - name: Apply twice; the second run must be a no-op
        run: |
          docker cp release.sql db:/tmp/release.sql
          docker exec db psql -U lookout -d lookout -v ON_ERROR_STOP=1 -q -f /tmp/release.sql
          docker exec db psql -U lookout -d lookout -v ON_ERROR_STOP=1 -q -f /tmp/release.sql
          docker exec db psql -U lookout -d lookout -tAc "select count(*) from timescaledb_information.hypertables" | grep -qx 2

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build api, field and web images
        run: docker compose build api field web
