# The whole system in one command:  docker compose up --build
#   Dashboard  http://localhost:8080   (Replay works at once; Live: sign in as incident commander)
#   The field service starts a new incident at 4x real time and plays the demo scenario into it.
#
# Credentials here are development-only placeholders. Change them before exposing anything.
name: lookout

x-dev-secrets: &dev-secrets
  MQTT_PASSWORD: lookout-dev-mqtt

services:
  db:
    restart: unless-stopped
    image: timescale/timescaledb-ha:pg17.11-ts2.31.0
    environment:
      POSTGRES_DB: lookout
      POSTGRES_USER: lookout
      POSTGRES_PASSWORD: lookout-dev
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./deploy/postgres/020_lookout_runtime.sql:/docker-entrypoint-initdb.d/020_lookout_runtime.sql:ro
    ports:
      - "127.0.0.1:${LOOKOUT_DB_PORT:-5432}:5432"   # so the API can run outside compose during development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookout -d lookout"]
      interval: 5s
      retries: 20

  mqtt:
    restart: unless-stopped
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
    ports:
      - "127.0.0.1:1883:1883"   # so a local field simulator or MQTT client can join

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Lookout.Api/Dockerfile
    environment:
      # Requests run as lookout_runtime (member of lookout_app: no DDL, insert-only audit trail);
      # migrations run as the owner.
      ConnectionStrings__Lookout: Host=db;Database=lookout;Username=lookout_runtime;Password=lookout-runtime-dev;GSS Encryption Mode=Disable
      ConnectionStrings__LookoutMigrations: Host=db;Database=lookout;Username=lookout;Password=lookout-dev;GSS Encryption Mode=Disable
      Lookout__DevAuth: "true"
      Lookout__Jwt__Key: dev-only-signing-key-change-me-0123456789
      Lookout__Mqtt__Host: mqtt
      Lookout__Mqtt__Username: lookout
      Lookout__Mqtt__Password: lookout-dev-mqtt
      # Web Push (VAPID) keys: development only. Make your own with: dotnet run --project src/Lookout.Sim -- vapid
      Lookout__WebPush__PublicKey: BLZMWH1OJnOjGu_xl4Z1WPxM7JnsxgA-TS8JVsjZb2piI1X64ATC6Of-vDYhltbePSZHuXBUdjsNrU1JMhKFAR8
      Lookout__WebPush__PrivateKey: nQj9ItZyAZ_XzMr4KTEc42ZQj9B_6Hnh9xh14YTllww
      # Optional TAK export: point at a TAK server's plain CoT input.
      # Lookout__Cot__Host: freetakserver
      # Lookout__Cot__Port: "8087"
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
    healthcheck:
      # The runtime image has no curl or wget; bash's /dev/tcp is enough for one HTTP GET.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 5s
      retries: 30

  field:
    build:
      context: .
      dockerfile: src/Lookout.Field/Dockerfile
    environment:
      LOOKOUT_API: http://api:8080
      MQTT_HOST: mqtt
      MQTT_USER: field
      MQTT_PASSWORD: lookout-dev-field
      CLOCK_RATE: "4"
      ACK_DELAY_SEC: "10"
    depends_on:
      api: { condition: service_healthy }
    restart: "no"

  web:
    restart: unless-stopped
    build:
      context: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  pgdata:
